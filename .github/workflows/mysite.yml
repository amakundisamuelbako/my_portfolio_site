name: Check and deploy site

on:
  push:
    branches: [main]
    pull_requests:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install tools
        run: npm ci

      - name: Check formatting and validate HTML
        run: npm run check
